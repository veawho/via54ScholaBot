name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- Go: build + vet + race tests on 3 OSes ----
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race -timeout 300s ./...
